AWSTemplateFormatVersion: '2010-09-09'
Description: UrbanBike ECS Task Definition

Resources:

  UrbanBikeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/urbanbike
      RetentionInDays: 7

  UrbanBikeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: urbanbike-task
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: arn:aws:iam::890009361711:role/urbanbike-task-execution-role
      TaskRoleArn: arn:aws:iam::890009361711:role/urbanbike-task-role
      ContainerDefinitions:
        - Name: urbanbike-container
          Image: 890009361711.dkr.ecr.us-east-1.amazonaws.com/urbanbike-backend:latest
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/urbanbike
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs

Outputs:
  TaskDefinitionArn:
    Value: !Ref UrbanBikeTaskDefinition